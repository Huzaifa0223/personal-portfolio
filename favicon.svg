<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="g1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Dark background with rounded corners -->
  <rect width="64" height="64" rx="14" fill="#0b0f19"/>

  <!-- Glowing gradient border -->
  <rect x="1.5" y="1.5" width="61" height="61" rx="13"
    fill="none" stroke="url(#g1)" stroke-width="2" opacity="0.9"/>

  <!-- Inner subtle glow layer -->
  <rect x="4" y="4" width="56" height="56" rx="11"
    fill="none" stroke="url(#g1)" stroke-width="0.5" opacity="0.3"/>

  <!-- The <H/> text with glow -->
  <text x="32" y="43"
    font-family="Outfit, monospace"
    font-size="24"
    font-weight="900"
    fill="url(#g1)"
    text-anchor="middle"
    filter="url(#glow)">&lt;H/&gt;</text>
</svg>